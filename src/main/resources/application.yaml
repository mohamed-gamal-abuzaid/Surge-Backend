server:
  port: 8081

spring:
  application:
    name: surge-backend

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/surge_db
    username: postgres
    password: 1111
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

# JWT
app:
  jwt:
    secret: Z3VyZ2UtcGxhdGZvcm0tc3VwZXItc2VjcmV0LWtleS0yMDI0LWNoYW5nZS10aGlzLWluLXByb2R1Y3Rpb24
    expiration: 86400000        # 24 hours
    refresh-expiration: 604800000  # 7 days

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method