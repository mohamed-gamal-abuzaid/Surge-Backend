# إعدادات البروتوكولات
rtmp: yes
rtsp: yes
hls: yes
webrtc: yes

# إعدادات مصادقة البث (Auth Webhook)
# لما OBS يضغط Start Streaming، ميديا إم تي إكس هيبعت طلب للباك إند
authMethod: http
authHTTPAddress: http://host.docker.internal:8080/api/internal/media/publish

# مسارات البث
paths:
  all:
    # لما الستريمر يقفل البث (Stop Streaming)، هيبعت طلب إشعار بانتهاء البث
    runOnUnpublish: curl -X POST http://host.docker.internal:8080/api/internal/media/unpublish -H "Content-Type:application/json" -d '{"path":"$MTX_PATH"}'
    runOnUnpublishRestart: no